# Render Blueprint - Content Refinery
# Deploy with: render.com/deploy?repo=YOUR_REPO_URL

services:
  # Web Service
  - type: web
    name: content-refinery
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: content-refinery-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SHOPIFY_STORE
        value: store-letstruck
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://content-refinery-07dc.onrender.com
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: NODE_ENV
        value: production
      # Cloudflare R2 Storage (for large file uploads)
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: content-refinery
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: content-refinery-db
    plan: basic-256mb
    databaseName: content_refinery
    user: content_refinery_user
